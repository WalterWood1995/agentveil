# AgentVeil configuration. Copy to agentveil.toml and adjust.
# Rule: all traffic goes only through the [upstream] tunnel; if it is down, requests are refused.

# Local data (identity keys, contacts)
data_dir = "~/.agentveil"

[upstream]
# "tor"   — a local Tor client SocksPort (per-identity circuits and one-call identity rotation)
# "socks" — any other local SOCKS5 proxy (sing-box / Xray / Clash / ...)
kind = "tor"
host = "127.0.0.1"        # must be an IP literal (no local DNS lookup)
port = 9050               # Tor Expert Bundle: 9050 · Tor Browser: 9150 · sing-box template: 1080
isolate = true            # Tor: random SOCKS credentials per identity => separate circuit & exit IP
control_port = 9051       # Tor control port (used by new_identity); 0 to disable
# control_password = ""   # if torrc uses HashedControlPassword; cookie auth is the default
# username = ""           # only for kind = "socks" when the proxy requires auth
# password = ""

[policy]
https_only = true                 # force HTTPS for normal sites (.onion excepted)
block_private_networks = true     # refuse 127.0.0.1 / LAN / cloud-metadata addresses
max_response_bytes = 5000000
timeout = 60
# allow_hosts = []                # explicit exceptions to the private-network block

[browser]
javascript = true                 # default; can be turned off per call
block_images = false              # true speeds up browsing over Tor
block_media = true
max_pages = 8

[search]
# tried in order; under Tor, DuckDuckGo is reached via its onion service
providers = ["duckduckgo", "duckduckgo_lite", "mojeek"]
prefer_onion = true
# searxng_url = "http://your-searxng.onion"   # add "searxng" to providers to use it

[messaging]
relay_url = ""                    # see README "Agent-to-agent messaging"
allow_direct_loopback_relay = false
